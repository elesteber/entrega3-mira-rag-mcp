[project]
name = "mira-cu3"
version = "0.1.0"
description = "MIRA CU-3: asistente de incorporación de organizaciones (RAG + MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # RAG (backend/rag) - Ángel
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    # MCP y datos (backend/mcp, backend/data) - Rodrigo
    "fastmcp>=2.0",
    "openpyxl>=3.1",
    "pyjwt>=2.8",
    # Backend FastAPI y Gemini (T001, Lester): agregar aquí
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# PyTorch solo CPU: evita descargar las ruedas CUDA (varios GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "modelo: pruebas que descargan/cargan el modelo de embeddings (lentas)",
]

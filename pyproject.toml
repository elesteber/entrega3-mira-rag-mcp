[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mira-cu3-onboarding"
version = "0.1.0"
description = "MIRA CU-3: Asistente de Incorporación de Organizaciones (RAG + MCP + Gemini Flash)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rodrigo Guerrero" },
    { name = "Jorge Álvarez" },
    { name = "Lester González" },
    { name = "Ángel Salgado" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "fastmcp>=0.4.0",
    "google-genai>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "modelo: pruebas que cargan el modelo de embeddings",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]


# PyTorch CPU: evita descargar dependencias CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
